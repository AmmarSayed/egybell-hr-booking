name: Deploy booking portal to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'src/**'
      - 'index.html'
      - 'package*.json'
      - 'tsconfig.json'
      - 'vite.config.ts'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      - run: npm run build -- --base="${{ steps.pages.outputs.base_path }}/"
        env:
          VITE_APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbzi64ASc30V_qrYkCz2sI_nrlTtmpMkfUD9QE0w_hvNzdXNzCQuvAoCeddDBnFufFe0PA/exec
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
